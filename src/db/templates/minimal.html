<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #111111; --gray-800: #2d2d2d; --gray-500: #737373;
    --gray-400: #a3a3a3; --gray-200: #e5e5e5; --gray-100: #f5f5f5;
    --gray-50: #fafafa; --white: #ffffff;
  }
  html, body {
    width: 595px; min-height: 842px; margin: 0 auto;
    font-family: 'IBM Plex Sans', sans-serif; font-size: 9pt;
    color: var(--black); background: var(--white); line-height: 1.5;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .cv-header {
    padding: 40px 44px 28px; border-bottom: 1px solid var(--gray-200);
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
  }
  .header-name {
    font-family: 'Space Grotesk', sans-serif; font-size: 28pt; font-weight: 300;
    color: var(--black); letter-spacing: -1.5px; line-height: 1.0;
  }
  .header-name strong { font-weight: 700; }
  .header-contact { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .header-contact span {
    font-size: 7.5pt; color: var(--gray-500); font-weight: 300; letter-spacing: 0.3px;
  }
  .cv-body { padding: 28px 44px 36px; }
  .section { margin-bottom: 22px; }
  .section:last-child { margin-bottom: 0; }
  .section-title {
    font-family: 'Space Grotesk', sans-serif; font-size: 7pt; font-weight: 500;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--gray-400);
    margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--gray-200);
  }
  .entry { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--gray-100); }
  .entry:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .entry-title {
    font-family: 'Space Grotesk', sans-serif; font-size: 9.5pt; font-weight: 600;
    color: var(--black); letter-spacing: -0.2px;
  }
  .entry-meta {
    font-size: 7.5pt; color: var(--gray-400); font-weight: 300; margin-top: 2px; margin-bottom: 5px; letter-spacing: 0.5px;
  }
  .entry-desc { font-size: 8.5pt; color: var(--gray-500); line-height: 1.55; font-weight: 300; }
  .summary-text { font-size: 9pt; color: var(--gray-500); line-height: 1.65; font-weight: 300; font-style: italic; }
  .skills-list { display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .skill-tag {
    font-size: 7.5pt; color: var(--gray-800); border: 1px solid var(--gray-200);
    padding: 2px 8px; font-weight: 400; background: var(--gray-50);
  }
  .lang-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0; border-bottom: 1px solid var(--gray-100);
  }
  .lang-row:last-child { border-bottom: none; }
  .lang-name { font-family: 'Space Grotesk', sans-serif; font-size: 8.5pt; font-weight: 500; color: var(--black); }
  .lang-level { font-size: 7.5pt; color: var(--gray-400); font-weight: 300; letter-spacing: 0.5px; }
  .cert-row {
    display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--gray-100);
  }
  .cert-row:last-child { border-bottom: none; }
  .cert-row .entry-title { font-size: 8.5pt; font-weight: 500; }
  .cert-row .entry-meta { font-size: 7.5pt; margin: 0; color: var(--gray-400); }
  @media print { html, body { width: 595px; } }
</style>
</head>
<body>
  <div class="cv-header">
    <div class="header-name">{{fullName}}</div>
    <div class="header-contact">
      <span>{{email}}</span>
      <span>{{phone}}</span>
      <span>{{location}}</span>
    </div>
  </div>
  <div class="cv-body">{{content}}</div>
</body>
</html>
