<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #2563EB; --blue-dark: #1d4ed8; --blue-light: #eff6ff; --blue-mid: #bfdbfe;
    --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
    --border: #e2e8f0; --bg: #ffffff; --surface: #f8fafc;
  }
  html, body {
    width: 595px; min-height: 842px; margin: 0 auto;
    font-family: 'DM Sans', sans-serif; font-size: 9.5pt;
    color: var(--text-primary); background: var(--bg); line-height: 1.55;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .cv-header {
    background: linear-gradient(135deg, #1e40af 0%, #2563EB 45%, #3b82f6 100%);
    padding: 28px 32px 24px; position: relative; overflow: hidden;
  }
  .cv-header::before {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,0.07);
  }
  .cv-header::after {
    content: ''; position: absolute; bottom: -30px; right: 80px;
    width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.05);
  }
  .header-name {
    font-size: 24pt; font-weight: 700; color: #ffffff;
    letter-spacing: -0.5px; line-height: 1.1; margin-bottom: 6px; position: relative; z-index: 1;
  }
  .header-contact {
    display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; position: relative; z-index: 1;
  }
  .header-contact span { font-size: 8.5pt; color: rgba(255,255,255,0.88); font-weight: 400; }
  .header-contact span + span::before { content: ' · '; opacity: 0.5; }
  .cv-body { padding: 24px 32px 32px; }
  .section { margin-bottom: 18px; }
  .section:last-child { margin-bottom: 0; }
  .section-title {
    font-size: 8pt; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--blue); margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid var(--blue);
  }
  .entry {
    margin-bottom: 12px; padding-left: 10px; border-left: 2.5px solid var(--blue-mid); padding-bottom: 2px;
  }
  .entry:last-child { margin-bottom: 0; }
  .entry-title { font-size: 10pt; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
  .entry-meta { font-size: 8pt; color: var(--blue); font-weight: 500; margin-top: 1px; margin-bottom: 4px; }
  .entry-desc { font-size: 8.5pt; color: var(--text-secondary); line-height: 1.5; }
  .summary-text {
    font-size: 9pt; color: var(--text-secondary); line-height: 1.6;
    padding: 10px 12px; background: var(--blue-light); border-left: 3px solid var(--blue); border-radius: 0 6px 6px 0;
  }
  .skills-list { display: flex; flex-wrap: wrap; gap: 5px; }
  .skill-tag {
    display: inline-block; padding: 3px 10px; background: var(--blue-light); color: var(--blue-dark);
    border-radius: 20px; font-size: 7.5pt; font-weight: 600; border: 1px solid var(--blue-mid);
  }
  .lang-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0; border-bottom: 1px solid var(--border);
  }
  .lang-row:last-child { border-bottom: none; }
  .lang-name { font-size: 8.5pt; font-weight: 600; color: var(--text-primary); }
  .lang-level {
    font-size: 7.5pt; color: var(--blue); font-weight: 500;
    background: var(--blue-light); padding: 2px 8px; border-radius: 10px;
  }
  .cert-row { display: flex; flex-direction: column; padding: 5px 0; border-bottom: 1px dashed var(--border); }
  .cert-row:last-child { border-bottom: none; }
  .cert-row .entry-title { font-size: 8.5pt; font-weight: 600; }
  .cert-row .entry-meta { font-size: 7.5pt; color: var(--text-muted); margin-top: 1px; margin-bottom: 0; }
  @media print { html, body { width: 595px; } }
</style>
</head>
<body>
  <div class="cv-header">
    <div class="header-name">{{fullName}}</div>
    <div class="header-contact">
      <span>{{email}}</span>
      <span>{{phone}}</span>
      <span>{{location}}</span>
    </div>
  </div>
  <div class="cv-body">{{content}}</div>
</body>
</html>
