<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Nunito:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal: #0d9488; --teal-dark: #0f766e; --teal-mid: #99f6e4;
    --teal-light: #f0fdfa; --teal-soft: #ccfbf1; --ink: #134e4a;
    --text: #1f2937; --text-mid: #4b5563; --text-muted: #9ca3af;
    --border: #e5e7eb; --bg: #ffffff;
  }
  html, body {
    width: 595px; min-height: 842px; margin: 0 auto;
    font-family: 'Nunito', sans-serif; font-size: 9pt;
    color: var(--text); background: var(--bg); line-height: 1.55;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .cv-header {
    background: var(--teal); padding: 28px 32px 24px;
    position: relative; overflow: hidden;
  }
  .cv-header::before {
    content: ''; position: absolute; top: -20px; right: -20px;
    width: 140px; height: 140px; border-radius: 50%; border: 20px solid rgba(255,255,255,0.07);
  }
  .cv-header::after {
    content: ''; position: absolute; bottom: -30px; right: 100px;
    width: 80px; height: 80px; border-radius: 50%; border: 12px solid rgba(255,255,255,0.05);
  }
  .header-initial {
    position: absolute; right: 28px; bottom: -8px;
    font-family: 'Outfit', sans-serif; font-size: 88pt; font-weight: 800;
    color: rgba(255,255,255,0.08); line-height: 1; letter-spacing: -4px;
  }
  .header-name {
    font-family: 'Outfit', sans-serif; font-size: 22pt; font-weight: 700;
    color: #ffffff; letter-spacing: -0.5px; line-height: 1.1; margin-bottom: 12px;
    position: relative; z-index: 1;
  }
  .header-contact {
    display: flex; flex-wrap: wrap; gap: 5px 14px; position: relative; z-index: 1;
  }
  .header-contact span {
    font-size: 8pt; color: rgba(255,255,255,0.85); font-weight: 400;
    display: flex; align-items: center; gap: 5px;
  }
  .contact-dot {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--teal-mid); flex-shrink: 0;
  }
  .cv-body { padding: 22px 32px 28px; }
  .section { margin-bottom: 18px; position: relative; }
  .section:last-child { margin-bottom: 0; }
  .section-title {
    font-family: 'Outfit', sans-serif; font-size: 9pt; font-weight: 700;
    letter-spacing: 0.8px; text-transform: uppercase; color: var(--teal-dark);
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px; border: none;
  }
  .section-title::before {
    content: ''; display: inline-block; width: 18px; height: 3px;
    background: var(--teal); border-radius: 2px; flex-shrink: 0;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--teal-soft); }
  .entry {
    margin-bottom: 13px; padding: 10px 12px; background: var(--teal-light);
    border-radius: 6px; border-left: 3px solid var(--teal);
  }
  .entry:last-child { margin-bottom: 0; }
  .entry-title {
    font-family: 'Outfit', sans-serif; font-size: 10pt; font-weight: 600;
    color: var(--ink); letter-spacing: -0.1px;
  }
  .entry-meta {
    font-size: 7.5pt; color: var(--teal-dark); font-weight: 600;
    margin-top: 2px; margin-bottom: 5px; letter-spacing: 0.3px;
  }
  .entry-desc { font-size: 8.5pt; color: var(--text-mid); line-height: 1.55; font-weight: 400; }
  .summary-text {
    font-size: 9.5pt; color: var(--text-mid); line-height: 1.65; font-style: italic; font-weight: 300;
    padding: 10px 14px; background: var(--teal-light); border-radius: 6px; border-top: 3px solid var(--teal);
  }
  .skills-list { display: flex; flex-wrap: wrap; gap: 5px 6px; }
  .skill-tag {
    display: inline-block; padding: 3px 11px; background: var(--teal-soft); color: var(--teal-dark);
    border-radius: 4px; font-size: 7.5pt; font-weight: 600; font-family: 'Outfit', sans-serif;
    border: 1px solid var(--teal-mid);
  }
  .lang-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 10px; border-radius: 4px; margin-bottom: 3px; background: var(--teal-light);
  }
  .lang-row:last-child { margin-bottom: 0; }
  .lang-name { font-family: 'Outfit', sans-serif; font-size: 9pt; font-weight: 600; color: var(--ink); }
  .lang-level {
    font-size: 7.5pt; color: var(--teal-dark); font-weight: 600;
    background: var(--teal-soft); padding: 2px 8px; border-radius: 10px; border: 1px solid var(--teal-mid);
  }
  .cert-row {
    display: flex; align-items: flex-start; gap: 6px; padding: 6px 10px;
    background: var(--teal-light); border-radius: 4px; margin-bottom: 3px;
  }
  .cert-row:last-child { margin-bottom: 0; }
  .cert-row::before {
    content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--teal); margin-top: 3px; flex-shrink: 0;
  }
  .cert-row .entry-title { font-size: 8.5pt; font-weight: 600; }
  .cert-row .entry-meta { font-size: 7.5pt; color: var(--text-muted); margin: 0 0 0 4px; display: inline; font-weight: 400; }
  @media print {
    html, body { width: 595px; }
    .cv-header, .cv-header * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div class="cv-header">
    <div class="header-initial">V</div>
    <div class="header-name">{{fullName}}</div>
    <div class="header-contact">
      <span><span class="contact-dot"></span>{{email}}</span>
      <span><span class="contact-dot"></span>{{phone}}</span>
      <span><span class="contact-dot"></span>{{location}}</span>
    </div>
  </div>
  <div class="cv-body">{{content}}</div>
</body>
</html>
